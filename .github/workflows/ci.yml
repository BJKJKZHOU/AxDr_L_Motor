name: Firmware Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi

      - name: Check generated parameter files
        run: |
          python3 -m pip install PyYAML
          python3 tools/gen_parameters.py --check

      - name: Configure
        run: cmake --preset gcc-release

      - name: Build
        run: cmake --build --preset gcc-release

      - name: Generate firmware files
        run: |
          arm-none-eabi-objcopy -O binary \
            build/gcc-release/AxDr_L_Motor.elf \
            build/gcc-release/AxDr_L_Motor.bin
          arm-none-eabi-objcopy -O ihex \
            build/gcc-release/AxDr_L_Motor.elf \
            build/gcc-release/AxDr_L_Motor.hex

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/gcc-release/AxDr_L_Motor.elf
            build/gcc-release/AxDr_L_Motor.bin
            build/gcc-release/AxDr_L_Motor.hex
            build/gcc-release/AxDr_L_Motor.map
          if-no-files-found: error
          retention-days: 30
