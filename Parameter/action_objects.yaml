# AxDr_L host-visible write-trigger actions.
#
# Actions share the same 16-bit ID namespace as Parameter values, but they do
# not store a value. Every valid host WRITE with type=action is one trigger.
# The generated dispatch maps the action ID to the existing Motor command path.

schema: 1

objects:
  ACTION_MOTOR_ENABLE:
    id: 0x1001
    access: wo
    command: MOTOR_CMD_ENABLE
    description: "使能电机功率级。"

  ACTION_MOTOR_RUN:
    id: 0x1002
    access: wo
    command: MOTOR_CMD_RUN
    description: "按当前Motor Mode启动运行；PHASE_SEARCH模式下作为异步寻相启动动作。"

  ACTION_MOTOR_STOP:
    id: 0x1003
    access: wo
    command: MOTOR_CMD_STOP
    description: "停止当前运行并回到ENABLED。"

  ACTION_MOTOR_DISABLE:
    id: 0x1004
    access: wo
    command: MOTOR_CMD_DISABLE
    description: "立即关闭PWM并进入DISABLED。"

  ACTION_IDENT_RS_LS_START:
    id: 0x1101
    access: wo
    command: MOTOR_CMD_IDENT_START
    arg: IDENT_RS_LS
    async: true
    description: "启动Rs/Ls辨识。"

  ACTION_IDENT_FLUX_START:
    id: 0x1102
    access: wo
    command: MOTOR_CMD_IDENT_START
    arg: IDENT_FLUX
    async: true
    description: "启动Flux辨识。"

  ACTION_IDENT_ABORT:
    id: 0x1103
    access: wo
    command: MOTOR_CMD_IDENT_ABORT
    description: "中止当前辨识。"

  ACTION_IDENT_APPLY:
    id: 0x1104
    access: wo
    command: MOTOR_CMD_IDENT_APPLY
    description: "将最近一次有效辨识结果应用到Motor参数。"

  ACTION_PROTECTION_CLEAR:
    id: 0x1201
    access: wo
    command: MOTOR_CMD_PROTECTION_CLEAR
    description: "在DISABLED状态清除可清除的保护状态。"
