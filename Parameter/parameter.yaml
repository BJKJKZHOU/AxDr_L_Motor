# AxDr_L host-visible parameter dictionary.
#
# Single source of truth for value parameters and write-trigger actions.
# Generated firmware/host files are produced by tools/gen_parameters.py.
#
# Value types: u8, i8, f32, i32, u32, position.
# Actions use type: action, access: wo. Every valid WRITE is one trigger;
# actions do not store a value and do not depend on value changes.
#
# label is the short human-facing engineering name exported to Host/UI.
# PARAM_* symbols, numeric IDs and C bindings remain machine-facing names.

schema: 1

objects:
  PARAM_ADC_IA:
    id: 0x0001
    type: f32
    access: ro
    binding: ADC.Ia_A
    label: Ia
    unit: A
    description: "ADC采样得到的A相电流反馈。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_ADC_IB:
    id: 0x0002
    type: f32
    access: ro
    binding: ADC.Ib_A
    label: Ib
    unit: A
    description: "ADC采样得到的B相电流反馈。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_ADC_IC:
    id: 0x0003
    type: f32
    access: ro
    binding: ADC.Ic_A
    label: Ic
    unit: A
    description: "由相电流采样链得到的C相电流反馈。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_ADC_VBUS:
    id: 0x0004
    type: f32
    access: ro
    binding: ADC.Vbus_V
    label: Vbus
    unit: V
    description: "直流母线电压采样值。"
    plot: { modes: [normal] }

  PARAM_RUN_ID:
    id: 0x0010
    type: f32
    access: ro
    binding: Motor_Run.Id
    label: Id
    unit: A
    description: "FOC Park变换后的d轴实际电流反馈。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_RUN_IQ:
    id: 0x0011
    type: f32
    access: ro
    binding: Motor_Run.Iq
    label: Iq
    unit: A
    description: "FOC Park变换后的q轴实际电流反馈。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_RUN_UD:
    id: 0x0012
    type: f32
    access: ro
    binding: Motor_Run.Ud
    label: Ud
    unit: V
    description: "FOC电流环输出的d轴电压。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_RUN_UQ:
    id: 0x0013
    type: f32
    access: ro
    binding: Motor_Run.Uq
    label: Uq
    unit: V
    description: "FOC电流环输出的q轴电压。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_RUN_THETA_E:
    id: 0x0014
    type: f32
    access: ro
    binding: Motor_Run.Theta_e
    label: θe
    unit: rad
    description: "当前FOC实际使用的电角度。"
    plot: { modes: [fast, normal], fast_scale: 0.0002 }

  PARAM_RUN_UALPHA:
    id: 0x0015
    type: f32
    access: ro
    binding: Motor_Run.Ualpha
    label: Uα
    unit: V
    description: "上一快环实际送入SVPWM的alpha轴电压命令。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_RUN_UBETA:
    id: 0x0016
    type: f32
    access: ro
    binding: Motor_Run.Ubeta
    label: Uβ
    unit: V
    description: "上一快环实际送入SVPWM的beta轴电压命令。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_OBS_THETA:
    id: 0x0020
    type: f32
    access: ro
    binding: Flux_PLL.State.Theta
    label: θe Obs
    unit: rad
    description: "磁链观测器PLL估算的电角度。"
    plot: { modes: [fast, normal], fast_scale: 0.0002 }

  PARAM_OBS_WE:
    id: 0x0021
    type: f32
    access: ro
    binding: Flux_PLL.State.We
    label: ωe Obs
    unit: rad/s
    description: "磁链观测器PLL估算的电角速度。"
    plot: { modes: [fast, normal], fast_scale: 0.1 }

  PARAM_MECH_ESO_THETA:
    id: 0x0022
    type: f32
    access: ro
    binding: Mechanical_ESO.State.Theta
    label: θm ESO
    unit: rad
    description: "Mechanical ESO估算的单圈机械角度，范围[0,2π)，仅用于诊断与波形对比。"
    plot: { modes: [fast, normal], fast_scale: 0.0002 }

  PARAM_MECH_ESO_WM:
    id: 0x0023
    type: f32
    access: ro
    binding: Mechanical_ESO.State.Wm
    label: ωm ESO
    unit: rad/s
    description: "Mechanical ESO估算的机械角速度。"
    plot: { modes: [fast, normal], fast_scale: 0.1 }

  PARAM_MECH_ESO_TD:
    id: 0x0024
    type: f32
    access: ro
    binding: Mechanical_ESO.State.Td
    label: Td
    unit: N*m
    description: "Mechanical ESO估算的负载/扰动转矩，仅用于诊断。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_MECH_ESO_ERROR:
    id: 0x0025
    type: f32
    access: ro
    binding: Mechanical_ESO.State.Error
    label: ESO Error
    unit: rad
    description: "Mechanical ESO的单圈角度观测误差，Theta_meas-Theta_hat回绕到[-π,π)。"
    plot: { modes: [fast, normal], fast_scale: 0.0002 }

  PARAM_MOTOR_PP:
    id: 0x0101
    type: u8
    access: rw
    persistent: true
    binding: Motor_Para.Pp
    label: Pole Pairs
    description: "电机极对数。"
    write_state: disabled
    range:
      min: 1
      max: 255

  PARAM_MOTOR_RS:
    id: 0x0110
    type: f32
    access: rw
    persistent: true
    binding: Motor_Para.Rs
    label: Rs
    unit: ohm
    description: "电机相电阻Rs，供电机模型、电流控制及无感相关算法使用。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTOR_LD:
    id: 0x0111
    type: f32
    access: rw
    persistent: true
    binding: Motor_Para.Ld
    label: Ld
    unit: H
    description: "电机d轴电感Ld。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTOR_LQ:
    id: 0x0112
    type: f32
    access: rw
    persistent: true
    binding: Motor_Para.Lq
    label: Lq
    unit: H
    description: "电机q轴电感Lq。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTOR_FLUX:
    id: 0x0113
    type: f32
    access: rw
    persistent: true
    binding: Motor_Para.Flux
    label: λm
    unit: Wb
    description: "电机永磁磁链参数。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTOR_J:
    id: 0x0114
    type: f32
    access: rw
    persistent: true
    binding: Motor_Para.J
    label: J
    unit: kg*m^2
    description: "电机及等效负载转动惯量参数J。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTOR_B:
    id: 0x0115
    type: f32
    access: rw
    persistent: true
    binding: Motor_Para.B
    label: B
    description: "电机粘性阻尼/摩擦模型参数B。"
    write_state: disabled
    range: { min: 0.0 }

  PARAM_MOTOR_DIR:
    id: 0x0116
    type: i8
    access: rw
    persistent: true
    binding: Motor_Config.Dir
    label: Motor Direction
    description: "用户机械正方向与内部控制方向之间的符号映射，只允许-1或+1。"
    write_state: disabled
    allowed: [-1, 1]

  PARAM_MOTOR_ALIGN_CURRENT:
    id: 0x0117
    type: f32
    access: rw
    persistent: true
    binding: Motor_Config.Align_Current_A
    label: Align Current
    unit: A
    description: "该电机进行标准Align预定位时使用的d轴电流，供Flux/JB辨识与正常无感启动共用。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true, max_binding: Motor_Lim.I_Max }

  PARAM_MOTOR_IF_CURRENT:
    id: 0x0118
    type: f32
    access: rw
    persistent: true
    binding: Motor_Config.IF_Current_A
    label: I/F Current
    unit: A
    description: "该电机标准I/F开环拖动使用的q轴电流，供Flux/JB辨识与正常无感运行共用。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true, max_binding: Motor_Lim.I_Max }

  PARAM_MOTOR_RL_I_PEAK:
    id: 0x0119
    type: f32
    access: rw
    persistent: true
    binding: Motor_Config.RL_I_Peak_A
    label: RL Injection Peak
    unit: A
    description: "RL辨识注入电流目标峰值，为直流偏置与交流幅值之和，按65%直流、35%交流分配，默认1 A；独立于保护限值。最小约0.114286 A对应交流幅值0.04 A，启动时需低于有效电流限值。"
    write_state: disabled
    range: { min: 0.11428572, max_binding: Motor_Lim.I_Max }

  PARAM_LIMIT_I_MAX:
    id: 0x0201
    type: f32
    access: rw
    persistent: true
    binding: User_Lim.I_Max
    label: Imax
    unit: A
    description: "用户配置的最大相电流限制，实际限制不会超过硬件/固件Motor_Lim.I_Max。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true, max_binding: Motor_Lim.I_Max }

  PARAM_LIMIT_WM_MAX:
    id: 0x0202
    type: f32
    access: rw
    persistent: true
    binding: User_Lim.Wm_Max
    label: ωm Max
    unit: rad/s
    description: "用户配置的最大机械角速度限制，实际限制不会超过Motor_Lim.Wm_Max。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true, max_binding: Motor_Lim.Wm_Max }

  PARAM_LIMIT_I_EFFECTIVE:
    id: 0x0203
    type: f32
    access: ro
    getter: Motor_I_Limit_Effective_Get
    label: Imax Active
    unit: A
    description: "当前控制实际使用的相电流上限。"

  PARAM_LIMIT_WM_EFFECTIVE:
    id: 0x0204
    type: f32
    access: ro
    getter: Motor_Wm_Limit_Effective_Get
    label: ωm Max Active
    unit: rad/s
    description: "当前控制使用的机械速度上限，为Motor与User速度限值的较小值，与目标转速无关。"

  PARAM_LIMIT_VBUS_MIN:
    id: 0x0205
    type: f32
    access: ro
    getter: Protection_Vbus_Min_Get
    label: Vbus Min
    unit: V
    description: "AxDr_L板级固定欠压保护阈值，只读。"

  PARAM_LIMIT_VBUS_MAX:
    id: 0x0206
    type: f32
    access: ro
    getter: Protection_Vbus_Max_Get
    label: Vbus Max
    unit: V
    description: "AxDr_L板级固定过压保护阈值，只读。"

  PARAM_ENCODER_PROTOCOL:
    id: 0x0301
    type: u8
    access: rw
    persistent: true
    binding: Encoder_Config.Protocol
    label: Encoder Protocol
    description: "运行前选择的编码器通信协议。"
    write_state: disabled
    allowed_symbols: [ENC_PROTOCOL_NONE, ENC_PROTOCOL_SPI]
    on_change: ENCODER_CONFIG

  PARAM_ENCODER_READY:
    id: 0x0302
    type: u8
    access: ro
    binding: Encoder.Ready
    label: Encoder Ready
    description: "编码器驱动是否已经完成初始化并可供控制使用。"
    range: { min: 0, max: 1 }

  PARAM_ENCODER_VALID:
    id: 0x0303
    type: u8
    access: ro
    binding: Encoder.Valid
    label: Encoder Valid
    description: "当前编码器反馈数据是否有效。"
    range: { min: 0, max: 1 }

  PARAM_ENCODER_FAULT:
    id: 0x0304
    type: u8
    access: ro
    binding: Encoder.Fault
    label: Encoder Fault
    description: "当前编码器故障标志。"
    range: { min: 0, max: 1 }

  PARAM_ENCODER_SPI_TYPE:
    id: 0x0310
    type: u8
    access: rw
    persistent: true
    binding: Encoder_Config.SPI_Type
    label: SPI Encoder
    description: "SPI协议下选择的编码器芯片协议。"
    write_state: disabled
    allowed_symbols: [ENC_SPI_MT6816, ENC_SPI_MT6835]
    on_change: ENCODER_CONFIG

  PARAM_PHASE_I_SEARCH:
    id: 0x0401
    type: f32
    access: rw
    binding: Servo_Phase_Config.I_Search_A
    label: Phase Search Current
    unit: A
    description: "伺服寻相两次静态ALIGN的Id电流及方向辨识起转的Iq电流；起转后Iq归零等待500ms。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_CAL_VALID:
    id: 0x0402
    type: u8
    access: ro
    persistent: true
    binding: Motor_Cal.Valid
    label: Calibration Valid
    description: "当前伺服相位/编码器校准结果是否有效。"
    range: { min: 0, max: 1 }

  PARAM_CAL_ENC_DIR:
    id: 0x0403
    type: i8
    access: ro
    persistent: true
    binding: Motor_Cal.Enc_Dir
    label: Encoder Direction
    description: "寻相得到的编码器方向符号，按工程约定用于机械方向对齐。"
    allowed: [-1, 1]

  PARAM_CAL_THETA_OFF:
    id: 0x0404
    type: f32
    access: ro
    persistent: true
    binding: Motor_Cal.Theta_Off
    label: θe Offset
    unit: rad
    description: "寻相/校准得到的编码器到电角度的零位偏置。"

  PARAM_PHASE_THETA_OFF_ERROR:
    id: 0x0410
    type: f32
    access: ro
    getter: Servo_Phase_Theta_Off_Error_Get
    label: Phase Offset Error
    unit: rad
    description: "两次静态ALIGN计算得到的电角零位偏差，单位rad；最后一次成功计算后更新。"

  PARAM_PHASE_VERIFY_MOVE:
    id: 0x0411
    type: f32
    access: ro
    getter: Servo_Phase_Verify_Move_Get
    label: Phase Verify Move (retired)
    unit: rad
    description: "已停用的寻相诊断字段；简化寻相不再执行正Iq验证，此值恒为0。"

  PARAM_RUN_POSITION:
    id: 0x0501
    type: position
    access: ro
    getter: Parameter_Run_Position_Get
    label: Position
    unit: turn+rad
    description: "当前用户机械坐标下的位置反馈。"

  PARAM_RUN_WM:
    id: 0x0502
    type: f32
    access: ro
    getter: Motor_Wm_Get
    label: ωm
    unit: rad/s
    description: "当前用户机械坐标下的机械角速度反馈。"

  # 0x0503 retired with encoder differential speed. Use PARAM_MECH_ESO_WM.
  PARAM_REF_IQ:
    id: 0x0510
    type: f32
    access: ro
    getter: Motor_Iq_Ref_Get
    label: Iq Ref
    unit: A
    description: "最近一次快环实际使用的q轴电流参考。"

  PARAM_REF_WM:
    id: 0x0511
    type: f32
    access: ro
    getter: Motor_Wm_Ref_Get
    label: ωm Ref
    unit: rad/s
    description: "当前速度控制实际使用的用户机械速度参考。"

  PARAM_REF_POSITION:
    id: 0x0512
    type: position
    access: ro
    getter: Motor_Position_Ref_Get
    label: Position Ref
    unit: turn+rad
    description: "当前位置轨迹实际使用的用户机械位置参考。"

  # 0x0601 retired: position motion uses PARAM_TARGET_SPEED. Do not reuse this
  # ID: older NVS snapshots may still contain its persistent speed value.
  PARAM_MOTION_WM_ACC:
    id: 0x0602
    type: f32
    access: rw
    persistent: true
    binding: Motion_Config.Wm_Acc
    label: Acceleration
    unit: rad/s^2
    description: "运动规划器机械加速度限制，可在运行期间修改。"
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTION_WM_DEC:
    id: 0x0603
    type: f32
    access: rw
    persistent: true
    binding: Motion_Config.Wm_Dec
    label: Deceleration
    unit: rad/s^2
    description: "运动规划器机械减速度限制，可在运行期间修改。"
    range: { min: 0.0, exclusive_min: true }

  PARAM_MOTION_TE_RATE:
    id: 0x0604
    type: f32
    access: rw
    persistent: true
    binding: Motion_Config.Te_Rate
    label: Torque Slew Rate
    unit: N*m/s
    description: "仅Torque模式的转矩指令变化率，运行及Stop降至零转矩共用；0关闭斜坡，默认0。可在运行期间修改，不影响Speed和Position模式。"
    range: { min: 0.0 }

  PARAM_MOTION_PROFILE:
    id: 0x0605
    type: u8
    access: rw
    persistent: true
    binding: Motion_Config.Profile
    label: Motion Profile
    description: "有感Speed/Position轨迹：0梯形；1五次速度S曲线、保持梯形加减速时间（峰值1.875倍）；2五次速度S曲线、保持峰值加减速度（时间1.875倍）。允许DISABLED/ENABLED修改，RUN禁止。"
    write_state: not_running
    allowed_symbols: [MOTION_TRAPEZOID, MOTION_S_TIME, MOTION_S_PEAK]

  PARAM_MOTOR_MODE:
    id: 0x0701
    type: u8
    access: rw
    binding: Motor_Mode
    label: Mode
    description: "当前选择的电机控制模式；与TORQUE/SPEED/POSITION/OPEN_LOOP/IDENT/SENSORLESS_SPEED/PHASE_SEARCH对应。"
    write_state: disabled
    allowed_symbols: [TORQUE, SPEED, POSITION, OPEN_LOOP, IDENT, SENSORLESS_SPEED, PHASE_SEARCH]

  PARAM_TARGET_TORQUE:
    id: 0x0702
    type: f32
    access: rw
    binding: Motor_Cmd.Te_Target
    label: Torque Target
    unit: N*m
    description: "Torque模式的用户机械转矩目标。"

  PARAM_TARGET_SPEED:
    id: 0x0703
    type: f32
    access: rw
    binding: Motor_Cmd.Wm_Target
    label: Speed Target
    unit: rad/s
    description: "共用用户机械速度指令。Speed、Open-loop、Sensorless及Flux辨识使用有符号转速；Position使用绝对值规划运动，方向由目标位置决定，0使轨迹减速停止并保持位置。指令执行时受Motor与User速度限值约束，不覆盖原指令；不保存到Flash，上电为0。"

  PARAM_TARGET_POSITION:
    id: 0x0704
    type: position
    access: rw
    binding: Motor_Cmd.Position_Target
    label: Position Target
    unit: turn+rad
    description: "Position模式的用户机械位置目标；wire格式固定为little-endian int32 Turn + float32 Theta，一次写入。"

  PARAM_MOTOR_STATE:
    id: 0x0710
    type: u8
    access: ro
    getter: Motor_State_Get
    label: Motor State
    description: "电机顶级生命周期状态，只读：DISABLED、ENABLED或RUN。状态迁移通过Action完成。"
    allowed_symbols: [DISABLED, ENABLED, RUN]

  PARAM_EVENT_REPORT:
    id: 0x0801
    type: u32
    access: ro
    binding: Protection.Report
    label: Report
    description: "当前提示/报告级事件位图。"

  PARAM_EVENT_WARNING:
    id: 0x0802
    type: u32
    access: ro
    binding: Protection.Warning
    label: Warning
    description: "当前警告级事件位图；警告不自动关闭电机。"

  PARAM_EVENT_ERROR:
    id: 0x0803
    type: u32
    access: ro
    binding: Protection.Fault
    label: Error
    description: "当前错误级事件位图；非零时软件自动Disable并禁止重新Enable。"

  PARAM_EVENT_TRIP:
    id: 0x0804
    type: u32
    access: ro
    binding: Protection.Trip
    label: Trip
    description: "当前硬件快速关断级事件位图。"

  PARAM_IDENT_RS_LS_VALID:
    id: 0x0901
    type: u8
    access: ro
    getter: Identification_Rs_Ls_Valid_Get
    label: Rs/Ls Valid
    description: "最近一次Rs/Ls辨识结果是否有效。"
    range: { min: 0, max: 1 }

  PARAM_IDENT_RS_RESULT:
    id: 0x0902
    type: f32
    access: ro
    getter: Identification_Rs_Get
    label: Rs Result
    unit: ohm
    description: "最近一次Rs/Ls辨识得到的相电阻结果。"

  PARAM_IDENT_LS_RESULT:
    id: 0x0903
    type: f32
    access: ro
    getter: Identification_Ls_Get
    label: Ls Result
    unit: H
    description: "最近一次Rs/Ls辨识得到的等效相电感结果。"

  PARAM_IDENT_FLUX_VALID:
    id: 0x0910
    type: u8
    access: ro
    getter: Identification_Flux_Valid_Get
    label: Flux Valid
    description: "最近一次Flux辨识结果是否有效。"
    range: { min: 0, max: 1 }

  PARAM_IDENT_FLUX_RESULT:
    id: 0x0911
    type: f32
    access: ro
    getter: Identification_Flux_Get
    label: λm Result
    unit: Wb
    description: "最近一次Flux辨识得到的永磁磁链结果。"

  PARAM_IDENT_FAIL_REASON:
    id: 0x0912
    type: u8
    access: ro
    getter: Identification_Fail_Reason_Get
    label: Identification Failure
    description: "最近一次辨识失败原因；0表示无失败，非零仅用于最终诊断。"
    range: { min: 0, max: 4 }

  PARAM_IDENT_JB_VALID:
    id: 0x0920
    type: u8
    access: ro
    getter: Identification_JB_Valid_Get
    label: J/B Valid
    description: "最近一次J/B辨识结果是否有效。"
    range: { min: 0, max: 1 }

  PARAM_IDENT_J_RESULT:
    id: 0x0921
    type: f32
    access: ro
    getter: Identification_J_Get
    label: J Result
    unit: kg*m^2
    description: "最近一次J/B辨识得到的转动惯量J。"

  PARAM_IDENT_B_RESULT:
    id: 0x0922
    type: f32
    access: ro
    getter: Identification_B_Get
    label: B Result
    unit: N*m*s/rad
    description: "最近一次J/B辨识得到的粘性阻尼B。"

  PARAM_IDENT_JB_EXCITE_RATIO:
    id: 0x0923
    type: f32
    access: rw
    binding: Ident_JB_Excite_Ratio
    label: J/B Excitation
    description: "J/B辨识正弦机械速度激励幅值相对自动工作点速度的比例；默认0.20。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true, max: 1.0, exclusive_max: true }

  PARAM_IDENT_JB_EXCITE_HZ:
    id: 0x0924
    type: f32
    access: rw
    binding: Ident_JB_Excite_Hz
    label: J/B Frequency
    unit: Hz
    description: "J/B辨识正弦机械速度激励频率；默认3 Hz。"
    write_state: disabled
    range: { min: 0.0, exclusive_min: true }

  PARAM_CTRL_CURRENT_BW_HZ:
    id: 0x0A01
    type: f32
    access: rw
    persistent: true
    binding: Control_Current_Bw_Hz
    label: Current Bandwidth
    unit: Hz
    description: "电流环设计带宽；写入后切换为Bandwidth并由当前Rs/Ld/Lq重新计算Id/Iq PI增益。"
    write_state: not_running
    range: { min: 0.0, exclusive_min: true, max: 5000.0 }
    on_change: CURRENT_TUNING

  PARAM_CTRL_ID_KP:
    id: 0x0A02
    type: f32
    access: rw
    persistent: true
    binding: Current_Manual.Id_Kp
    label: Manual Id Kp
    description: "Id电流环Manual配置Kp；写入后切换为Manual并发布整组手调增益。"
    write_state: not_running
    range: { min: 0.0 }
    on_change: CURRENT_GAIN

  PARAM_CTRL_ID_KI:
    id: 0x0A03
    type: f32
    access: rw
    persistent: true
    binding: Current_Manual.Id_Ki
    label: Manual Id Ki
    description: "Id电流环Manual配置Ki；写入后切换为Manual并发布整组手调增益。"
    write_state: not_running
    range: { min: 0.0 }
    on_change: CURRENT_GAIN

  PARAM_CTRL_IQ_KP:
    id: 0x0A04
    type: f32
    access: rw
    persistent: true
    binding: Current_Manual.Iq_Kp
    label: Manual Iq Kp
    description: "Iq电流环Manual配置Kp；写入后切换为Manual并发布整组手调增益。"
    write_state: not_running
    range: { min: 0.0 }
    on_change: CURRENT_GAIN

  PARAM_CTRL_IQ_KI:
    id: 0x0A05
    type: f32
    access: rw
    persistent: true
    binding: Current_Manual.Iq_Ki
    label: Manual Iq Ki
    description: "Iq电流环Manual配置Ki；写入后切换为Manual并发布整组手调增益。"
    write_state: not_running
    range: { min: 0.0 }
    on_change: CURRENT_GAIN

  PARAM_CTRL_CURRENT_SOURCE:
    id: 0x0A06
    type: u8
    access: rw
    persistent: true
    binding: Control_Current_Tune_Source
    label: Current Tuning Source
    description: "当前电流环增益来源；Bandwidth按模型和带宽生成实际PI，Manual发布RAM中的Id/Iq手调参数。切换不读Flash，Save保存当前Manual配置。"
    write_state: not_running
    allowed_symbols: [CTRL_TUNE_BANDWIDTH, CTRL_TUNE_MANUAL]
    on_change: CURRENT_SOURCE

  PARAM_CTRL_CURRENT_FF_ENABLE:
    id: 0x0A07
    type: u8
    access: rw
    persistent: true
    binding: Current_FF_Enable
    label: Current dq Feedforward
    description: "有感Torque/Speed/Position模式的dq交叉耦合与反电动势前馈；0关闭(默认)，1开启，使用机械ESO转速及电机Ld/Lq/Flux。"
    write_state: not_running
    allowed: [0, 1]

  PARAM_CTRL_SPEED_BW_HZ:
    id: 0x0A10
    type: f32
    access: rw
    persistent: true
    binding: Control_Speed_Bw_Hz
    label: Speed Bandwidth
    unit: Hz
    description: "速度环设计带宽；写入后切换为Bandwidth并由当前J/B/Flux/Pp重新计算速度PI增益。"
    write_state: not_running
    range: { min: 0.0, exclusive_min: true, max: 500.0 }
    on_change: SPEED_TUNING

  PARAM_CTRL_SPEED_KP:
    id: 0x0A11
    type: f32
    access: rw
    persistent: true
    binding: Speed_Manual.Kp
    label: Manual Speed Kp
    description: "速度环Manual配置Kp；写入后切换为Manual并发布整组手调增益。"
    write_state: not_running
    range: { min: 0.0 }
    on_change: SPEED_GAIN

  PARAM_CTRL_SPEED_KI:
    id: 0x0A12
    type: f32
    access: rw
    persistent: true
    binding: Speed_Manual.Ki
    label: Manual Speed Ki
    description: "速度环Manual配置Ki；写入后切换为Manual并发布整组手调增益。"
    write_state: not_running
    range: { min: 0.0 }
    on_change: SPEED_GAIN

  PARAM_CTRL_SPEED_SOURCE:
    id: 0x0A13
    type: u8
    access: rw
    persistent: true
    binding: Control_Speed_Tune_Source
    label: Speed Tuning Source
    description: "当前速度环增益来源；Bandwidth按模型和带宽生成实际PI，Manual发布RAM中的手调参数。切换不读Flash，Save保存当前Manual配置。"
    write_state: not_running
    allowed_symbols: [CTRL_TUNE_BANDWIDTH, CTRL_TUNE_MANUAL]
    on_change: SPEED_SOURCE

  PARAM_CTRL_POSITION_KP:
    id: 0x0A20
    type: f32
    access: rw
    persistent: true
    binding: Pos_Ctrl.Para.Kp
    label: Position Kp
    description: "位置环P增益，单位为(rad/s)/rad。"
    write_state: not_running
    range: { min: 0.0 }

  PARAM_CTRL_MECH_ESO_BW_HZ:
    id: 0x0A30
    type: f32
    access: rw
    persistent: true
    binding: Mechanical_ESO_Bw_Hz
    label: ESO Bandwidth
    unit: Hz
    description: "20 kHz机械ESO设计带宽；写入后按当前J/B/Kt刷新Observer增益。"
    write_state: not_running
    range: { min: 1.0, max: 2000.0 }

  ACTION_MOTOR_ENABLE:
    id: 0x1001
    type: action
    access: wo
    command: MOTOR_CMD_ENABLE
    label: Enable
    description: "使能电机功率级。"

  ACTION_MOTOR_RUN:
    id: 0x1002
    type: action
    access: wo
    command: MOTOR_CMD_RUN
    label: Run
    description: "按当前Motor Mode启动运行；PHASE_SEARCH模式下作为异步寻相启动动作。"

  ACTION_MOTOR_STOP:
    id: 0x1003
    type: action
    access: wo
    command: MOTOR_CMD_STOP
    label: Stop
    description: "请求停止当前运行；运动模式按当前减速度受控停稳后回到ENABLED，Disable仍用于立即关闭驱动。"

  ACTION_MOTOR_DISABLE:
    id: 0x1004
    type: action
    access: wo
    command: MOTOR_CMD_DISABLE
    label: Disable
    description: "立即关闭PWM并进入DISABLED。"

  ACTION_IDENT_RS_LS_START:
    id: 0x1101
    type: action
    access: wo
    command: MOTOR_CMD_IDENT_START
    arg: IDENT_RS_LS
    label: Rs/Ls
    description: "启动Rs/Ls辨识。"

  ACTION_IDENT_FLUX_START:
    id: 0x1102
    type: action
    access: wo
    command: MOTOR_CMD_IDENT_START
    arg: IDENT_FLUX
    label: Flux
    description: "启动Flux辨识。"

  ACTION_IDENT_ABORT:
    id: 0x1103
    type: action
    access: wo
    command: MOTOR_CMD_IDENT_ABORT
    label: Abort
    description: "中止当前辨识。"

  ACTION_IDENT_APPLY:
    id: 0x1104
    type: action
    access: wo
    command: MOTOR_CMD_IDENT_APPLY
    label: Apply
    description: "将最近一次有效辨识结果应用到Motor参数。"

  ACTION_IDENT_JB_START:
    id: 0x1105
    type: action
    access: wo
    command: MOTOR_CMD_IDENT_START
    arg: IDENT_JB
    label: J/B
    description: "启动J/B辨识。"

  ACTION_PROTECTION_CLEAR:
    id: 0x1201
    type: action
    access: wo
    command: MOTOR_CMD_PROTECTION_CLEAR
    label: Clear Fault
    description: "在DISABLED状态清除可清除的保护状态。"

  ACTION_PARAMETER_SAVE:
    id: 0x1202
    type: action
    access: wo
    command: MOTOR_CMD_PARAMETER_SAVE
    label: Save Parameters
    description: "将当前持久化参数显式保存到NVS；仅DISABLED状态允许执行。"

  PARAM_CTRL_SPEED_KP_EFFECTIVE:
    id: 0x0A14
    type: f32
    access: ro
    binding: Speed_Ctrl.Para.Kp
    label: Speed Effective Kp
    description: "速度控制器当前实际使用的Kp，由Source选择生成；不保存。"

  PARAM_CTRL_SPEED_KI_EFFECTIVE:
    id: 0x0A15
    type: f32
    access: ro
    binding: Speed_Ctrl.Para.Ki
    label: Speed Effective Ki
    description: "速度控制器当前实际使用的Ki，由Source选择生成；不保存。"

  # Temporary frequency-response injection; never saved to NVS.
  PARAM_SIGNAL_FREQ_HZ:
    id: 0x0B01
    type: f32
    access: rw
    binding: Signal_Injection.Para.Freq_Hz
    label: Signal Frequency
    unit: Hz
    description: "有感D/Q电流环或速度环正弦激励频率；Start时锁存。"
    range: { min: 0.0, exclusive_min: true, max: 9999.0 }

  PARAM_SIGNAL_AMP_A:
    id: 0x0B02
    type: f32
    access: rw
    binding: Signal_Injection.Para.Amp_A
    label: Signal Amplitude
    unit: A
    description: "有感D/Q电流注入峰值；Start时按实际电流上限检查。"
    write_state: not_running
    range: { min: 0.0, exclusive_min: true }

  PARAM_SIGNAL_TIME_S:
    id: 0x0B03
    type: f32
    access: rw
    binding: Signal_Injection.Para.Time_S
    label: Signal Duration
    unit: s
    description: "单个激励频点的持续时间；到期自动结束，最大60秒。"
    range: { min: 0.0, exclusive_min: true, max: 60.0 }

  PARAM_SIGNAL_ACTIVE:
    id: 0x0B04
    type: u8
    access: ro
    binding: Signal_Injection.State.Active
    label: Signal Active
    description: "频率响应注入是否正在执行。"

  PARAM_SIGNAL_OUT:
    id: 0x0B05
    type: f32
    access: ro
    binding: Signal_Injection.State.Out
    label: Signal Injected
    description: "当前注入的正弦信号：D/Q为A，速度为机械rad/s；速度测试使用同周期速度快照。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_SIGNAL_ID_REF:
    id: 0x0B06
    type: f32
    access: ro
    binding: Id_Ctrl.Sig.Ref
    label: Id Ref
    unit: A
    description: "实际进入d轴电流PI的参考（含信号激励）。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_SIGNAL_ID_PI_OUT:
    id: 0x0B07
    type: f32
    access: ro
    binding: Id_Ctrl.Sig.Out
    label: Id PI Output
    unit: V
    description: "d轴PI电压输出，未叠加模型前馈、未经过最终dq二维限幅。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_SIGNAL_TARGET:
    id: 0x0B08
    type: u8
    access: rw
    binding: Signal_Injection.Para.Target
    label: FRF Target
    description: "注入目标：0为Id，1为Iq，2为有感速度环；在Start时锁存。"
    allowed_symbols: [SIGNAL_ID, SIGNAL_IQ, SIGNAL_SPEED]

  PARAM_SIGNAL_SPEED_AMP:
    id: 0x0B09
    type: f32
    access: rw
    binding: Signal_Injection.Para.Speed_Amp
    label: Speed FRF Amplitude
    unit: rad/s
    description: "有感速度环正弦激励的机械角速度峰值；Start时核对有效速度限值。"
    range: { min: 0.0, exclusive_min: true }

  PARAM_SIGNAL_IQ_REF:
    id: 0x0B0A
    type: f32
    access: ro
    binding: Iq_Ctrl.Sig.Ref
    label: Iq Ref
    unit: A
    description: "实际进入q轴电流PI的参考（含注入）。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_SIGNAL_IQ_PI_OUT:
    id: 0x0B0B
    type: f32
    access: ro
    binding: Iq_Ctrl.Sig.Out
    label: Iq PI Output
    unit: V
    description: "q轴PI电压输出，未叠加模型前馈、未经过最终dq二维限幅。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_SIGNAL_SPEED_REF:
    id: 0x0B0C
    type: f32
    access: ro
    binding: Motor_Frf_Speed.Ref
    label: Speed FRF We Ref
    unit: rad/s
    description: "2kHz速度PI消费的电角速度参考，FAST读取同步快照。"
    plot: { modes: [fast, normal], fast_scale: 0.05 }

  PARAM_SIGNAL_SPEED_FBK:
    id: 0x0B0D
    type: f32
    access: ro
    binding: Motor_Frf_Speed.Fbk
    label: Speed FRF We Feedback
    unit: rad/s
    description: "2kHz速度PI消费的ESO电角速度反馈，FAST读取同步快照。"
    plot: { modes: [fast, normal], fast_scale: 0.05 }

  PARAM_SIGNAL_SPEED_IQ_OUT:
    id: 0x0B0E
    type: f32
    access: ro
    binding: Motor_Frf_Speed.Iq
    label: Speed FRF Iq Command
    unit: A
    description: "2kHz速度PI本周期输出的IqRef，同步采集。"
    plot: { modes: [fast, normal], fast_scale: 0.001 }

  PARAM_SIGNAL_SPEED_INJ:
    id: 0x0B0F
    type: f32
    access: ro
    binding: Motor_Frf_Speed.Inj
    label: Speed FRF We Injection
    unit: rad/s
    description: "本次2kHz速度环实际叠加的电角速度正弦激励，同步采集。"
    plot: { modes: [fast, normal], fast_scale: 0.02 }

  ACTION_SIGNAL_START:
    id: 0x1301
    type: action
    access: wo
    command: MOTOR_CMD_SIGNAL_START
    label: Signal Start
    description: "在TORQUE/ENABLED执行D/Q电流激励，在SPEED/ENABLED执行速度激励。"

  ACTION_SIGNAL_ABORT:
    id: 0x1302
    type: action
    access: wo
    command: MOTOR_CMD_SIGNAL_ABORT
    label: Signal Abort
    description: "立即取消激励，不改变正常Motor Stop/Disable状态。"
